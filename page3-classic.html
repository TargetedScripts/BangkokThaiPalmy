<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangkok Thai - Menu (Classic Book Demo)</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="bg-white shadow-md sticky top-0 z-40 border-b border-red-100">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Logo Badge Merah Kontras -->
        <a href="index.html" class="bg-red-700 p-2 rounded-xl shadow-inner flex items-center justify-center hover:bg-red-800 transition">
          <img id="storeLogo" src="" alt="Logo" class="h-9 w-auto object-contain">
        </a>
        <div>
          <h1 id="storeName" class="font-bold text-lg text-red-700 leading-tight">Bangkok Thai</h1>
          <p class="text-xs text-gray-500">Layout Demo: <strong>Classic Menu Book</strong></p>
        </div>
      </div>
      
      <div class="flex items-center space-x-3">
        <a href="page2-grid.html" class="px-3 py-2 text-xs font-semibold rounded-lg bg-gray-100 hover:bg-red-50 hover:text-red-700 text-gray-700 transition flex items-center space-x-1">
          <i class="fa-solid fa-border-all"></i>
          <span class="hidden sm:inline">Try Modern Grid</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- CLASSIC BOOK HEADER BANNER -->
    <div class="text-center mb-8 pb-6 border-b border-red-200">
      <h2 class="text-3xl font-serif font-bold text-gray-900">TAKEOUT & DINING MENU</h2>
      <p class="text-xs text-gray-500 mt-1 uppercase tracking-widest">Authentic Thai Dishes Cooked Fresh Daily</p>
    </div>

    <!-- CATEGORY PILLS -->
    <div class="sticky top-[61px] z-30 bg-gray-50 py-3 mb-6">
      <div id="categoryPills" class="flex space-x-2 overflow-x-auto no-scrollbar py-1 justify-center"></div>
    </div>

    <!-- CLASSIC LIST CONTAINER -->
    <div id="menuContainer" class="space-y-4"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-gray-400 text-xs py-8 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
      <p id="footerStoreInfo">Bangkok Thai Takeaway | Palmerston North, NZ</p>
      <p>Powered by <strong>RestoSync SaaS</strong> &copy; 2026 TargetedScripts.com</p>
    </div>
  </footer>

  <script src="assets/js/bangkokthaipalmy.js"></script>
  <script>
    let currentCategory = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof RESTOSYNC_CONFIG === 'undefined') return;
      document.getElementById('storeName').innerText = RESTOSYNC_CONFIG.store.name;
      document.getElementById('storeLogo').src = RESTOSYNC_CONFIG.branding.logo;
      document.getElementById('footerStoreInfo').innerText = `${RESTOSYNC_CONFIG.store.name} | ${RESTOSYNC_CONFIG.store.address} | Phone: ${RESTOSYNC_CONFIG.store.phone}`;
      renderCategoryPills();
      renderMenu();
    });

    function renderCategoryPills() {
      const categories = ['ALL', ...new Set(RESTOSYNC_CONFIG.menuItems.map(item => item.category))];
      document.getElementById('categoryPills').innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition border ${cat === currentCategory ? 'bg-red-700 text-white border-red-700' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-100'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterCategory(cat) { currentCategory = cat; renderCategoryPills(); renderMenu(); }

    function renderMenu() {
      const items = currentCategory === 'ALL' ? RESTOSYNC_CONFIG.menuItems : RESTOSYNC_CONFIG.menuItems.filter(i => i.category === currentCategory);
      document.getElementById('menuContainer').innerHTML = items.map(item => `
        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex justify-between items-center hover:border-red-400 transition">
          <div class="pr-4">
            <div class="flex items-center space-x-2">
              <span class="font-bold text-gray-900 text-sm">${item.id}: ${item.name}</span>
              ${getSpiceBadge(item.spiceLevel)}
            </div>
            <p class="text-xs text-gray-500 mt-1">${item.description}</p>
          </div>
          <div class="flex items-center space-x-3 flex-shrink-0">
            <span class="font-bold text-red-700 text-base">$${item.price.toFixed(2)}</span>
          </div>
        </div>
      `).join('');
    }

    function getSpiceBadge(level) {
      if (!level || level === 0) return '';
      return `<span>${'<i class="fa-solid fa-pepper-hot text-red-500 text-xs"></i>'.repeat(level)}</span>`;
    }
  </script>
</body>
</html>
