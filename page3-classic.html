<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangkok Thai - Menu (Classic Book Demo)</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-900 text-amber-50 flex flex-col min-h-screen selection:bg-orange-700 selection:text-white">

  <!-- HEADER (Spice Terracotta Header) -->
  <header class="bg-orange-800 text-white shadow-xl sticky top-0 z-40 border-b border-orange-900">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-3 hover:opacity-90 transition">
          <img id="storeLogo" src="" alt="Logo" class="h-10 w-auto object-contain drop-shadow">
          <span class="font-bold text-xl tracking-wider text-amber-200 uppercase">Takeaway</span>
        </a>
      </div>
      
      <div class="flex items-center space-x-3">
        <a href="page2-grid.html" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-orange-950 hover:bg-black text-amber-100 border border-orange-700/50 transition flex items-center space-x-1.5">
          <i class="fa-solid fa-border-all text-amber-300"></i>
          <span class="hidden sm:inline">Try Modern Grid</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- CLASSIC BOOK HEADER BANNER -->
    <div class="text-center mb-8 pb-6 border-b border-orange-900/60">
      <h2 class="text-3xl font-serif font-bold text-amber-100 tracking-wider">TAKEOUT & DINING MENU</h2>
      <p class="text-xs text-amber-400 mt-1.5 uppercase tracking-widest font-medium">Authentic Thai Dishes Cooked Fresh Daily</p>
    </div>

    <!-- CATEGORY PILLS -->
    <div class="sticky top-[61px] z-30 bg-neutral-900/95 backdrop-blur-md py-3 mb-6 border-b border-neutral-800">
      <div id="categoryPills" class="flex space-x-2 overflow-x-auto no-scrollbar py-1 justify-center"></div>
    </div>

    <!-- CLASSIC LIST CONTAINER -->
    <div id="menuContainer" class="space-y-4"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-black text-neutral-500 text-xs py-8 mt-auto border-t border-neutral-900">
    <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
      <p id="footerStoreInfo">Bangkok Thai Takeaway | Palmerston North, NZ</p>
      <p>Powered by <strong class="text-neutral-400">RestoSync SaaS</strong> &copy; 2026 TargetedScripts.com</p>
    </div>
  </footer>

  <script src="assets/js/bangkokthaipalmy.js"></script>
  <script>
    let currentCategory = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof RESTOSYNC_CONFIG === 'undefined') return;
      document.getElementById('storeLogo').src = RESTOSYNC_CONFIG.branding.logo;
      document.getElementById('footerStoreInfo').innerText = `${RESTOSYNC_CONFIG.store.name} | ${RESTOSYNC_CONFIG.store.address} | Phone: ${RESTOSYNC_CONFIG.store.phone}`;
      renderCategoryPills();
      renderMenu();
    });

    function renderCategoryPills() {
      const categories = ['ALL', ...new Set(RESTOSYNC_CONFIG.menuItems.map(item => item.category))];
      document.getElementById('categoryPills').innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition border ${cat === currentCategory ? 'bg-orange-700 text-white border-orange-600 shadow-md font-bold' : 'bg-neutral-800 text-amber-200/80 border-neutral-700 hover:bg-neutral-700'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterCategory(cat) { currentCategory = cat; renderCategoryPills(); renderMenu(); }

    function renderMenu() {
      const items = currentCategory === 'ALL' ? RESTOSYNC_CONFIG.menuItems : RESTOSYNC_CONFIG.menuItems.filter(i => i.category === currentCategory);
      document.getElementById('menuContainer').innerHTML = items.map(item => `
        <div class="bg-neutral-800/80 p-4 rounded-xl border border-neutral-700/60 shadow-md flex justify-between items-center hover:border-orange-500/60 transition group">
          <div class="pr-4">
            <div class="flex items-center space-x-2">
              <span class="font-bold text-amber-100 text-sm group-hover:text-amber-300 transition">${item.id}: ${item.name}</span>
              ${getSpiceBadge(item.spiceLevel)}
            </div>
            <p class="text-xs text-neutral-400 mt-1 leading-relaxed">${item.description}</p>
          </div>
          <div class="flex items-center space-x-3 flex-shrink-0">
            <span class="font-extrabold text-orange-400 text-base">$${item.price.toFixed(2)}</span>
          </div>
        </div>
      `).join('');
    }

    function getSpiceBadge(level) {
      if (!level || level === 0) return '';
      return `<span class="flex items-center space-x-0.5">${'<i class="fa-solid fa-pepper-hot text-orange-500 text-xs"></i>'.repeat(level)}</span>`;
    }
  </script>
</body>
</html>
