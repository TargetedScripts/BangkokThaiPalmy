<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Live Store</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .strike-red-diagonal {
      position: relative;
      display: inline-block;
      color: #a1a1aa;
      font-weight: 700;
    }
    .strike-red-diagonal::after {
      content: "";
      position: absolute;
      left: -3px; right: -3px; top: 50%; height: 3px;
      background: #ef4444;
      transform: translateY(-50%) rotate(-12deg);
      pointer-events: none;
    }
  </style>
</head>
<body id="mainBody" class="bg-zinc-900 text-stone-200 flex flex-col min-h-screen selection:bg-amber-500 selection:text-zinc-950 pb-16">

  <!-- HEADER -->
  <header id="mainHeader" class="text-white shadow-xl sticky top-0 z-50 border-b border-zinc-800/60 w-full bg-black"> 
    <div class="w-full px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <h1 id="storeNameHeader" class="font-bold text-lg text-amber-300">Memuat Toko...</h1>
        <span id="headerStatusBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider"></span>
      </div>
      <button onclick="toggleCartModal()" class="bg-amber-500 text-zinc-950 font-bold px-4 py-2 rounded-lg text-xs flex items-center space-x-2">
        <i class="fa-solid fa-basket-shopping"></i>
        <span>Cart</span>
        <span id="cartCount" class="bg-zinc-950 text-amber-400 text-xs px-1.5 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="relative w-full h-[320px] bg-zinc-950 flex flex-col justify-center items-center text-center p-6 text-white">
    <h2 id="heroTitle" class="text-2xl md:text-3xl font-extrabold uppercase mb-2">Memuat...</h2>
    <p id="heroTagline" class="text-sm md:text-base text-stone-300 max-w-xl"></p>
  </section>

  <!-- MAIN MENU -->
  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">
    <div class="border-b border-zinc-800 pb-4 mb-6">
      <h2 class="text-2xl font-bold">Daftar Menu</h2>
    </div>
    <div id="menuContentBox" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-stone-500">Memuat menu dari Firebase...</p>
    </div>
  </main>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
      authDomain: "restosync-saas.firebaseapp.com",
      projectId: "restosync-saas",
      storageBucket: "restosync-saas.firebasestorage.app",
      messagingSenderId: "780544019719",
      appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const TENANT_ID = urlParams.get('tenant') || 'bangkokthaipalmy';

    let cart = [];

    db.collection("tenants").doc(TENANT_ID).onSnapshot((doc) => {
      if (doc.exists && doc.data().config) {
        const config = doc.data().config;
        const store = config.store || {};
        
        document.getElementById('storeNameHeader').innerText = store.name || 'Store';
        document.getElementById('heroTitle').innerText = store.name || 'Store';
        document.getElementById('heroTagline').innerText = store.tagline || '';

        const menuItems = config.menuItems || [];
        const menuBox = document.getElementById('menuContentBox');

        if (menuItems.length === 0) {
          menuBox.innerHTML = `<p class="text-stone-500">Tidak ada menu tersedia.</p>`;
          return;
        }

        menuBox.innerHTML = menuItems.map(item => `
          <div class="bg-zinc-800 rounded-2xl overflow-hidden shadow-lg border border-zinc-700 p-4 flex flex-col justify-between">
            <div>
              <img src="${item.image || 'https://images.unsplash.com/photo-1541658016709-82535e94bc69'}" class="w-full h-40 object-cover rounded-xl mb-3">
              <h3 class="font-bold text-base text-stone-100">${item.name}</h3>
              <p class="text-xs text-stone-400 mt-1 line-clamp-2">${item.description || ''}</p>
            </div>
            <div class="mt-4 flex items-center justify-between">
              <span class="text-amber-400 font-bold text-base">$${Number(item.price).toFixed(2)}</span>
              <button onclick="alert('Ditambahkan: ${item.name}')" class="bg-amber-500 text-zinc-950 text-xs font-bold px-3 py-2 rounded-lg">Tambah</button>
            </div>
          </div>
        `).join('');
      } else {
        document.getElementById('storeNameHeader').innerText = "Tenant Tidak Ditemukan";
      }
    }, (error) => {
      console.error("Firebase Error:", error);
      document.getElementById('storeNameHeader').innerText = "Gagal Memuat Data";
    });

    function toggleCartModal() {
      alert("Keranjang belanja aktif.");
    }
  </script>
</body>
</html>
