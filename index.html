<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Live Store Enterprise</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-stone-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <span class="text-amber-500 text-xl"><i class="fa-solid fa-store"></i></span>
      <h1 id="store-name" class="font-bold text-lg tracking-wide text-amber-400">Memuat Toko...</h1>
    </div>
    <div class="flex items-center space-x-4">
      <span id="store-status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-zinc-800 text-stone-300 border border-zinc-700">Mengecek...</span>
      <button onclick="window.toggleCartModal()" class="relative bg-amber-500 text-zinc-950 px-3 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-1.5 shadow hover:bg-amber-400 transition">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-counter">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Banner Visual Section -->
  <section id="hero-banner" class="relative bg-zinc-900 border-b border-zinc-800 py-16 px-4 text-center bg-cover bg-center overflow-hidden" style="background-image: linear-gradient(to bottom, rgba(9, 9, 11, 0.85), rgba(9, 9, 11, 0.95)), url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5');">
    <div class="max-w-3xl mx-auto space-y-3 relative z-10">
      <span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Authentic Multi-Vertical Dining</span>
      <h2 id="store-tagline" class="text-2xl md:text-4xl font-extrabold text-stone-100 tracking-tight">Memuat Slogan...</h2>
      <p id="store-address" class="text-xs md:text-sm text-stone-300 flex items-center justify-center space-x-2 pt-1">
        <i class="fa-solid fa-location-dot text-amber-400 mr-1"></i> <span id="address-text">Memuat alamat...</span>
      </p>
    </div>
  </section>

  <!-- Category Pills Bar -->
  <nav class="sticky top-[57px] z-30 bg-zinc-950/95 border-b border-zinc-800 px-4 py-3 overflow-x-auto whitespace-nowrap scrollbar-none shadow-sm">
    <div id="category-container" class="inline-flex space-x-2">
      <!-- Tombol Kategori dirender dinamis -->
    </div>
  </nav>

  <!-- Main Catalog Grid Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic Item Cards -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-zinc-900 border-t border-zinc-800 text-center py-6 text-xs text-stone-500 space-y-1">
    <p>&copy; 2026 RestoSync SaaS Enterprise Ecosystem. Powered by Firebase Firestore.</p>
    <p class="text-[10px] text-stone-600">Zero-Flicker Real-Time Multi-Tenant Engine</p>
  </footer>

  <!-- Firebase SDKs (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // State Aplikasi Global Sederhana
    const AppState = {
      tenantId: "bangkokthaipalmy",
      config: {},
      cart: [],
      currentCategory: "ALL",
      
      addToCart(item, effectivePrice) {
        const existing = this.cart.find(c => c.id === item.id);
        if (existing) {
          existing.qty++;
        } else {
          this.cart.push({ ...item, price: effectivePrice, qty: 1 });
        }
        document.getElementById('cart-counter').innerText = this.getCartItemCount();
      },

      getCartItemCount() {
        return this.cart.reduce((sum, item) => sum + item.qty, 0);
      },

      getCartSubtotal() {
        return this.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      }
    };

    window.filterCat = function(category) {
      AppState.currentCategory = category;
      renderCatalogGrid();
      renderCategories();
    };

    window.addToOrder = function(itemId) {
      const menuItems = AppState.config.menuItems || [];
      const item = menuItems.find(i => i.id === itemId);
      if (item) {
        const effectivePrice = (item.promoPrice && Number(item.promoPrice) < Number(item.price)) 
          ? Number(item.promoPrice) 
          : Number(item.price);
        AppState.addToCart(item, effectivePrice);
        
        // Feedback visual tombol
        const btn = document.getElementById(`btn-${itemId}`);
        if(btn) {
          const originalText = btn.innerHTML;
          btn.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Ditambahkan!`;
          btn.className = "w-full bg-emerald-600 text-white text-xs font-bold py-2.5 rounded-lg transition flex items-center justify-center space-x-1.5 shadow";
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.className = "w-full bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 text-stone-200 text-xs font-bold py-2.5 rounded-lg transition border border-zinc-700 flex items-center justify-center space-x-1.5";
          }, 1000);
        }
      }
    };

    window.toggleCartModal = function() {
      const count = AppState.getCartItemCount();
      const subtotal = AppState.getCartSubtotal();
      alert(`🛒 Keranjang Belanja:\nTotal Item: ${count}\nSubtotal: $${subtotal.toFixed(2)}`);
    };

    function renderCategories() {
      const items = AppState.config.menuItems || [];
      const categories = [...new Set(items.map(i => i.category || 'General'))];
      const container = document.getElementById('category-container');
      
      let html = `
        <button onclick="window.filterCat('ALL')" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition border ${AppState.currentCategory === 'ALL' ? 'bg-amber-500 text-zinc-950 font-bold shadow-md' : 'bg-zinc-900 text-stone-300 border-zinc-800 hover:bg-zinc-800'}">ALL</button>
      `;

      categories.forEach(cat => {
        const isActive = cat === AppState.currentCategory;
        html += `
          <button onclick="window.filterCat('${cat}')" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition border ${isActive ? 'bg-amber-500 text-zinc-950 font-bold shadow-md' : 'bg-zinc-900 text-stone-300 border-zinc-800 hover:bg-zinc-800'}">${cat}</button>
        `;
      });
      container.innerHTML = html;
    }

    function renderCatalogGrid() {
      const items = AppState.config.menuItems || [];
      const filtered = items.filter(item => {
        if (AppState.currentCategory === 'ALL') return true;
        return item.category === AppState.currentCategory;
      });

      const gridEl = document.getElementById('catalog-grid');
      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="col-span-full text-center py-12 text-stone-500">Tidak ada item ditemukan dalam kategori ini.</div>`;
        return;
      }

      let gridHtml = '';
      filtered.forEach(item => {
        const hasPromo = item.promoPrice && Number(item.promoPrice) < Number(item.price);
        gridHtml += `
          <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-zinc-700 transition">
            <div>
              <div class="h-48 bg-zinc-800 relative overflow-hidden">
                <img src="${item.image || 'https://images.unsplash.com/photo-1541658016709-82535e94bc69'}" alt="${item.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                ${hasPromo ? '<span class="absolute top-3 left-3 bg-red-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow">PROMO</span>' : ''}
              </div>
              <div class="p-4 space-y-2">
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-stone-100 text-base leading-snug">${item.name}</h3>
                  <div class="text-right whitespace-nowrap ml-2">
                    ${hasPromo ? `<span class="text-xs text-stone-500 line-through mr-1.5">$${Number(item.price).toFixed(2)}</span><span class="text-amber-400 font-bold text-base">$${Number(item.promoPrice).toFixed(2)}</span>` : `<span class="text-amber-400 font-bold text-base">$${Number(item.price).toFixed(2)}</span>`}
                  </div>
                </div>
                <p class="text-xs text-stone-400 line-clamp-2">${item.description || ''}</p>
              </div>
            </div>
            <div class="p-4 pt-0">
              <button id="btn-${item.id}" onclick="window.addToOrder('${item.id}')" class="w-full bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 text-stone-200 text-xs font-bold py-2.5 rounded-lg transition border border-zinc-700 flex items-center justify-center space-x-1.5 shadow">
                <i class="fa-solid fa-plus"></i>
                <span>Tambah ke Pesanan</span>
              </button>
            </div>
          </div>
        `;
      });
      gridEl.innerHTML = gridHtml;
    }

    // Inisialisasi Firebase & Tarik Data Real-time
    const firebaseConfig = {
      apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
      authDomain: "restosync-saas.firebaseapp.com",
      projectId: "restosync-saas",
      storageBucket: "restosync-saas.firebasestorage.app",
      messagingSenderId: "780544019719",
      appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    AppState.tenantId = urlParams.get('tenant') || 'bangkokthaipalmy';

    db.collection('tenants').doc(AppState.tenantId).onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        AppState.config = data.config || {};
        const store = AppState.config.store || {};

        // Render Header & Hero Banner
        document.getElementById('store-name').innerText = store.name || 'RestoSync Store';
        document.getElementById('store-tagline').innerText = store.tagline || 'Selamat Datang di Toko Kami';
        document.getElementById('address-text').innerText = `${store.address || ''} | Tel: ${store.phone || ''}`;

        // Status Toko Buka
        const statusBadge = document.getElementById('store-status-badge');
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-950 text-emerald-300 border border-emerald-800 flex items-center";
        statusBadge.innerHTML = `<i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse text-emerald-400"></i> BUKA`;

        // Render Kategori & Katalog Menu
        renderCategories();
        renderCatalogGrid();
      } else {
        document.getElementById('store-name').innerText = "Tenant Tidak Ditemukan";
      }
    });
  </script>
</body>
</html>
