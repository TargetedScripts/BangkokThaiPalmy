<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Live Store</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body class="bg-zinc-950 text-stone-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Sticky Header -->
  <header id="store-header" class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <span id="store-logo-icon" class="text-amber-500 text-xl"><i class="fa-solid fa-store"></i></span>
      <h1 id="store-name" class="font-bold text-lg tracking-wide text-amber-400">Loading Store...</h1>
    </div>
    <div class="flex items-center space-x-4">
      <span id="store-status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-zinc-800 text-stone-300 border border-zinc-700">Checking...</span>
      <button onclick="window.toggleCartModal()" class="relative bg-amber-500 text-zinc-950 px-3 py-1.5 rounded-lg font-bold text-sm flex items-center space-x-1.5 shadow">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-counter">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-zinc-900 border-b border-zinc-800 px-4 py-8 text-center">
    <div class="max-w-2xl mx-auto space-y-2">
      <h2 id="store-tagline" class="text-xl md:text-2xl font-extrabold text-stone-100">Authentic Flavours Cooked Fresh to Order</h2>
      <p id="store-address" class="text-xs text-stone-400"><i class="fa-solid fa-location-dot mr-1"></i> Loading address...</p>
    </div>
  </section>

  <!-- Category Pills Bar -->
  <nav class="sticky top-[57px] z-30 bg-zinc-950/95 border-b border-zinc-800 px-4 py-2.5 overflow-x-auto whitespace-nowrap scrollbar-none">
    <div id="category-container" class="inline-flex space-x-2">
      <!-- Rendered dynamically -->
    </div>
  </nav>

  <!-- Main Catalog Grid Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Dynamic Item Cards -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-zinc-900 border-t border-zinc-800 text-center py-4 text-xs text-stone-500">
    <p>&copy; 2026 RestoSync SaaS Enterprise Ecosystem. Powered by Firebase Firestore.</p>
  </footer>

  <!-- Firebase SDKs (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Application Initialization Script -->
  <script type="module">
    import { TenantLoader } from './assets/js/core/tenant-loader.js';
    import { AppState } from './assets/js/core/state.js';
    import { StoreStatusEngine } from './assets/js/modules/store-status.js';
    import { CatalogEngine } from './assets/js/modules/catalog-engine.js';

    window.filterCat = function(category) {
      AppState.currentCategory = category;
      renderAppUI();
    };

    window.toggleCartModal = function() {
      alert(`Keranjang belanja memiliki ${AppState.getCartItemCount()} item. Subtotal: $${AppState.getCartSubtotal().toFixed(2)}`);
    };

    window.addToOrder = function(itemId) {
      const item = AppState.config.menuItems?.find(i => i.id === itemId);
      if (item) {
        const effectivePrice = (item.promoPrice && Number(item.promoPrice) < Number(item.price)) 
          ? Number(item.promoPrice) 
          : Number(item.price);
        AppState.addToCart(item, effectivePrice);
        document.getElementById('cart-counter').innerText = AppState.getCartItemCount();
      }
    };

    function renderAppUI() {
      const config = AppState.config;
      if (!config) return;

      // Render Store Info safely
      const store = config.store || {};
      document.getElementById('store-name').innerText = store.name || 'RestoSync Store';
      document.getElementById('store-tagline').innerText = store.tagline || '';
      document.getElementById('store-address').innerHTML = `<i class="fa-solid fa-location-dot mr-1"></i> ${store.address || ''} | <i class="fa-solid fa-phone ml-2 mr-1"></i> ${store.phone || ''}`;

      // Check Store Status
      const status = StoreStatusEngine.checkStatus(config.operatingHours);
      const statusBadge = document.getElementById('store-status-badge');
      if (status.isOpen) {
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-950 text-emerald-300 border border-emerald-800";
        statusBadge.innerHTML = `<i class="fa-solid fa-circle text-[8px] mr-1 animate-pulse"></i> OPEN NOW (${status.todayHoursStr})`;
      } else {
        statusBadge.className = "px-3 py-1 rounded-full text-xs font-bold bg-rose-950 text-rose-300 border border-rose-800";
        statusBadge.innerHTML = `<i class="fa-solid fa-circle text-[8px] mr-1"></i> CLOSED (${status.todayHoursStr})`;
      }

      // Render Categories & Catalog Grid
      CatalogEngine.renderCategories(document.getElementById('category-container'));
      
      const filteredItems = CatalogEngine.getFilteredItems();
      const gridEl = document.getElementById('catalog-grid');
      
      if (filteredItems.length === 0) {
        gridEl.innerHTML = `<div class="col-span-full text-center py-12 text-stone-500">Tidak ada item ditemukan dalam kategori ini.</div>`;
        return;
      }

      let gridHtml = '';
      filteredItems.forEach(item => {
        const hasPromo = item.promoPrice && Number(item.promoPrice) < Number(item.price);
        gridHtml += `
          <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow flex flex-col justify-between">
            <div>
              <div class="h-40 bg-zinc-800 relative overflow-hidden">
                <img src="${item.image || 'https://images.unsplash.com/photo-1541658016709-82535e94bc69'}" alt="${item.name}" class="w-full h-full object-cover">
                ${hasPromo ? '<span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">PROMO</span>' : ''}
              </div>
              <div class="p-4 space-y-1">
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-stone-100 text-base">${item.name}</h3>
                  <div class="text-right">
                    ${hasPromo ? `<span class="text-xs text-stone-500 line-through mr-1.5">$${Number(item.price).toFixed(2)}</span><span class="text-amber-400 font-bold">$${Number(item.promoPrice).toFixed(2)}</span>` : `<span class="text-amber-400 font-bold">$${Number(item.price).toFixed(2)}</span>`}
                  </div>
                </div>
                <p class="text-xs text-stone-400 line-clamp-2">${item.description || ''}</p>
              </div>
            </div>
            <div class="p-4 pt-0">
              <button onclick="window.addToOrder('${item.id}')" class="w-full bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 text-stone-200 text-xs font-bold py-2.5 rounded-lg transition border border-zinc-700 flex items-center justify-center space-x-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>Add to Order</span>
              </button>
            </div>
          </div>
        `;
      });
      gridEl.innerHTML = gridHtml;
    }

    // Inisialisasi Real-Time Listener
    document.addEventListener("DOMContentLoaded", () => {
      TenantLoader.initTenantListener((data) => {
        renderAppUI();
      });
    });
  </script>
</body>
</html>
