<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Live Store Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    .hero-slide { transition: opacity 1s ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .strike-red-diagonal { position: relative; display: inline-block; color: #a1a1aa; font-weight: 700; }
    .strike-red-diagonal::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 3px; background: #ef4444; transform: translateY(-50%) rotate(-12deg); pointer-events: none; }
    
    /* Otomatis Invert Logo di Hero Banner Menjadi Putih Bersih */
    .hero-logo-invert { filter: brightness(0) invert(1); }
  </style>
</head>
<body id="mainBody" class="bg-zinc-900 text-stone-200 flex flex-col min-h-screen pb-16">

  <!-- LICENSE SUSPENDED MODAL (Bypassed for testing) -->
  <div id="licenseSuspendedScreen" class="fixed inset-0 bg-zinc-950 z-[100] hidden flex items-center justify-center p-6 text-center">
    <div class="bg-zinc-900 border border-red-900/50 p-8 rounded-3xl max-w-md shadow-2xl space-y-4">
      <div class="w-16 h-16 bg-red-950 text-red-500 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-lock"></i></div>
      <h2 class="text-2xl font-black text-white">Store Access Suspended</h2>
      <p class="text-xs text-stone-400 leading-relaxed" id="suspendReason">Lisensi langganan kedaluwarsa.</p>
    </div>
  </div>

  <!-- HEADER -->
  <header id="mainHeader" class="sticky top-0 z-50 border-b border-zinc-800/60 w-full bg-black"> 
    <div class="w-full px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3 shrink-0">
        <img id="storeLogo" src="" alt="Logo" class="w-auto object-contain" style="height: 48px;">
        <span id="headerTitle" class="font-bold text-lg uppercase tracking-wider text-amber-300">TAKEAWAY</span>
      </div>
      <button onclick="toggleCartModal()" id="cartBtn" class="font-bold px-4 py-2 rounded-lg text-xs flex items-center space-x-2 bg-amber-500 text-zinc-950 shadow">
        <i class="fa-solid fa-basket-shopping"></i><span>Cart</span><span id="cartCount" class="bg-zinc-950 text-amber-400 text-xs px-1.5 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- FEATURE HIGHLIGHTS BAR -->
  <div id="featureHighlightsBar" class="bg-zinc-950 border-b border-zinc-800 py-2.5 px-4 hidden">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-center gap-4 text-xs font-semibold text-amber-300">
      <span id="hlBadge1" class="hidden items-center bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-full"><i class="fa-solid fa-check mr-1.5 text-amber-400"></i><span id="hlText1"></span></span>
      <span id="hlBadge2" class="hidden items-center bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-full"><i class="fa-solid fa-check mr-1.5 text-amber-400"></i><span id="hlText2"></span></span>
      <span id="hlBadge3" class="hidden items-center bg-amber-500/10 border border-amber-500/30 px-3 py-1 rounded-full"><i class="fa-solid fa-check mr-1.5 text-amber-400"></i><span id="hlText3"></span></span>
    </div>
  </div>

  <!-- HERO BANNER (DENGAN LOGO INVERT PUTIH) -->
  <section class="relative w-full h-[380px] md:h-[460px] bg-zinc-950 overflow-hidden">
    <div id="heroSlidesContainer" class="relative w-full h-full"></div>
    <div id="heroOverlayDiv" class="absolute inset-0 bg-gradient-to-t from-zinc-900 via-black/50 to-black/70 flex flex-col justify-center items-center text-center p-6 text-white">
      <!-- Logo otomatis invert menjadi putih di banner -->
      <img id="heroLogoInvert" src="" alt="Logo" class="w-auto object-contain mb-3 hero-logo-invert" style="height: 72px;">
      <h2 id="heroTaglineTitle" class="text-2xl md:text-3xl font-extrabold tracking-widest uppercase mb-2">Store Name</h2>
      <p id="bannerTagline" class="text-sm text-stone-300 mb-6">Authentic flavours cooked fresh.</p>
    </div>
  </section>

  <!-- MENU SECTION -->
  <section class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">
    <div id="catBarContainer" class="sticky top-[61px] z-30 py-3 -mx-4 px-4 mb-6 border-b border-zinc-800">
      <div id="categoryPills" class="flex space-x-2 overflow-x-auto no-scrollbar py-1"></div>
    </div>
    <div id="menuContentBox" class="w-full"></div>
  </section>

  <!-- CART MODAL -->
  <div id="cartModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex justify-end">
    <div id="cartDrawer" class="w-full max-w-md h-full flex flex-col shadow-2xl p-4 space-y-4">
      <div id="cartHeaderBg" class="p-3 text-white flex justify-between items-center rounded-lg shadow">
        <h3 class="font-bold text-base"><i class="fa-solid fa-cart-shopping mr-2"></i> Your Order & Estimate</h3>
        <button onclick="toggleCartModal()" class="text-white text-xl font-bold">&times;</button>
      </div>
      <div id="cartItemsList" class="flex-grow overflow-y-auto space-y-2 text-xs divide-y divide-zinc-800"></div>
      <div class="pt-3 border-t border-zinc-800 space-y-2 text-xs">
        <div class="flex justify-between"><span>Subtotal (Excl. GST)</span><span id="cartSubtotal">$0.00</span></div>
        <div class="flex justify-between"><span>GST (15% Included)</span><span id="cartGST">$0.00</span></div>
        <div class="flex justify-between font-bold text-base text-amber-400"><span>Total (NZD)</span><span id="cartTotal">$0.00</span></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="mainFooter" class="text-xs py-10 border-t border-zinc-800 mt-12 bg-black">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
      <div>
        <h4 id="footerStoreName" class="font-bold text-sm mb-2">Store Name</h4>
        <p id="footerAddress" class="mb-1">Address...</p>
        <p>Phone: <a id="footerPhone" href="#" class="underline">Phone...</a></p>
      </div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const MASTER_SECRET = "TargetedScripts-Master-Secret-2026!Key";
    const firebaseConfig = {
      apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
      authDomain: "restosync-saas.firebaseapp.com",
      projectId: "restosync-saas",
      storageBucket: "restosync-saas.firebasestorage.app",
      messagingSenderId: "780544019719",
      appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const TENANT_ID = urlParams.get('tenant') || 'bangkokthaipalmy';
    let activeConfig = {}, currentFilter = 'ALL', cart = [];

    document.addEventListener('DOMContentLoaded', () => {
      db.collection("tenants").doc(TENANT_ID).onSnapshot((doc) => {
        if (doc.exists && doc.data().config) {
          activeConfig = doc.data().config;
          
          // Bypass sementara untuk testing di HP
          if (!validateAESLicense(activeConfig.licenseToken)) return;

          applyThemeEngine();
          initStoreBranding();
          renderHighlightsBar();
          renderCategoryPills();
          renderMenuContentBox();
        }
      });
    });

    function validateAESLicense(token) {
      // Bypass aktif agar langsung bisa dibuka di HP tanpa kendala status suspended
      return true; 
    }

    function triggerSuspension(msg) {
      document.getElementById('suspendReason').innerText = msg;
      document.getElementById('licenseSuspendedScreen').classList.remove('hidden');
    }

    // Terapkan Tema Warna Menyeluruh ke Semua Elemen Website
    function applyThemeEngine() {
      const th = activeConfig.theme || {};
      document.getElementById('mainHeader').style.backgroundColor = th.headerBg || '#000000';
      document.getElementById('headerTitle').style.color = th.headerText || '#fde047';
      document.getElementById('mainBody').style.backgroundColor = th.bodyBg || '#18181b';
      document.getElementById('mainBody').style.color = th.mainText || '#e7e5e4';
      document.getElementById('heroOverlayDiv').style.backgroundColor = th.heroOverlay || 'rgba(0,0,0,0.6)';
      document.getElementById('catBarContainer').style.backgroundColor = th.catBarBg || '#18181b';
      document.getElementById('cartDrawer').style.backgroundColor = th.cardBg || '#27272a';
      document.getElementById('cartHeaderBg').style.backgroundColor = th.cartHeader || '#991b1b';
      document.getElementById('mainFooter').style.backgroundColor = th.footerBg || '#000000';
      document.getElementById('mainFooter').style.color = th.footerText || '#a8a29e';
    }

    function initStoreBranding() {
      const store = activeConfig.store || {};
      const branding = activeConfig.branding || {};
      document.getElementById('heroTaglineTitle').innerText = store.name || 'Store Name';
      document.getElementById('bannerTagline').innerText = store.tagline || '';
      document.getElementById('footerStoreName').innerText = store.name || 'Store Name';
      document.getElementById('footerAddress').innerText = store.address || '';
      document.getElementById('footerPhone').innerText = store.phone || '';

      if (branding.logo) {
        document.getElementById('storeLogo').src = branding.logo;
        document.getElementById('heroLogoInvert').src = branding.logo; // Otomatis putih di banner
      }
    }

    function renderHighlightsBar() {
      const hl = activeConfig.highlights || {};
      const bar = document.getElementById('featureHighlightsBar');
      let hasActive = false;
      [1, 2, 3].forEach(i => {
        const item = hl[`hl${i}`];
        const badge = document.getElementById(`hlBadge${i}`);
        if (item && item.active && item.text) {
          document.getElementById(`hlText${i}`).innerText = item.text;
          badge.classList.remove('hidden'); badge.classList.add('inline-flex'); hasActive = true;
        } else { badge.classList.add('hidden'); }
      });
      if (hasActive) bar.classList.remove('hidden'); else bar.classList.add('hidden');
    }

    function renderCategoryPills() {
      const items = (activeConfig.menuItems || []).filter(i => !i.isHidden);
      const categories = [...new Set(items.map(i => i.category))];
      const th = activeConfig.theme || {};
      const activeBg = th.catActive || '#f59e0b';
      const normalBg = th.catNormal || '#27272a';

      document.getElementById('categoryPills').innerHTML = `
        <button onclick="filterCategory('ALL')" class="px-4 py-2 rounded-full text-xs font-semibold ${currentFilter === 'ALL' ? 'text-zinc-950 font-bold' : 'text-stone-300'}" style="background-color: ${currentFilter === 'ALL' ? activeBg : normalBg};">ALL</button>
      ` + categories.map(c => `
        <button onclick="filterCategory('${c}')" class="px-4 py-2 rounded-full text-xs font-semibold ${currentFilter === c ? 'text-zinc-950 font-bold' : 'text-stone-300'}" style="background-color: ${currentFilter === c ? activeBg : normalBg};">${c}</button>
      `).join('');
    }

    function filterCategory(cat) { currentFilter = cat; renderCategoryPills(); renderMenuContentBox(); }

    function renderMenuContentBox() {
      const items = (activeConfig.menuItems || []).filter(i => !i.isHidden && (currentFilter === 'ALL' || i.category === currentFilter));
      const th = activeConfig.theme || {};
      const cardBg = th.cardBg || '#27272a';
      const cardBorder = th.cardBorder || '#3f3f46';
      const btnBg = th.btnBg || '#f59e0b';

      document.getElementById('menuContentBox').innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          ${items.map(item => `
            <div class="rounded-2xl p-4 border flex flex-col justify-between shadow-lg" style="background-color: ${cardBg}; border-color: ${cardBorder};">
              <div>
                <h3 class="font-bold text-base">${item.id}: ${item.name}</h3>
                <p class="text-xs text-stone-400 mt-1">${item.description || ''}</p>
                <div class="mt-3 font-black text-amber-400 text-lg">$${Number(item.price).toFixed(2)}</div>
              </div>
              <button onclick="addToCart('${item.id}')" class="mt-4 text-zinc-950 font-bold py-2.5 rounded-xl text-xs transition shadow" style="background-color: ${btnBg};">Add to Order</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function addToCart(id) {
      const item = activeConfig.menuItems.find(i => i.id === id);
      if (!item) return;
      cart.push({ ...item, price: item.price, qty: 1 });
      document.getElementById('cartCount').innerText = cart.length;
      updateCartUI();
    }

    function updateCartUI() {
      const total = cart.reduce((s,i)=>s+(i.price*i.qty),0);
      document.getElementById('cartSubtotal').innerText = `$${(total/1.15).toFixed(2)}`;
      document.getElementById('cartGST').innerText = `$${(total - total/1.15).toFixed(2)}`;
      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
      document.getElementById('cartItemsList').innerHTML = cart.map(i => `<div class="py-2 flex justify-between"><span>${i.name}</span><span class="text-amber-400 font-bold">$${i.price}</span></div>`).join('');
    }

    function toggleCartModal() { document.getElementById('cartModal').classList.toggle('hidden'); }
  </script>
</body>
</html>
