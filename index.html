<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Live Store Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .hero-slide { transition: opacity 1s ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body id="mainBody" class="bg-zinc-900 text-stone-200 flex flex-col min-h-screen pb-16">

  <!-- HEADER -->
  <header id="mainHeader" class="sticky top-0 z-50 border-b border-zinc-800/60 w-full bg-black"> 
    <div class="w-full px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-2 shrink-0">
        <img id="storeLogo" src="" alt="Logo" class="w-auto object-contain" style="height: 38px;">
        <span class="font-bold text-sm uppercase tracking-wider text-amber-300">TAKEAWAY</span>
      </div>
      <button onclick="toggleCartModal()" id="cartBtn" class="font-bold px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1.5 bg-amber-500 text-zinc-950 shadow">
        <i class="fa-solid fa-basket-shopping"></i><span>Cart</span><span id="cartCount" class="bg-zinc-950 text-amber-400 text-xs px-1.5 py-0.2 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="relative w-full h-[320px] md:h-[420px] bg-zinc-950 overflow-hidden">
    <div id="heroSlidesContainer" class="absolute inset-0 w-full h-full">
      <div class="absolute inset-0 w-full h-full">
        <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=80" class="w-full h-full object-cover">
      </div>
    </div>
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-900 via-black/40 to-black/60 flex flex-col justify-center items-center text-center p-4 text-white z-10">
      <h2 id="heroTaglineTitle" class="text-xl md:text-3xl font-extrabold tracking-widest uppercase mb-1">Store Name</h2>
      <p id="bannerTagline" class="text-xs md:text-sm text-stone-300">Authentic flavours cooked fresh.</p>
    </div>
  </section>

  <!-- MENU SECTION -->
  <section class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">
    <div class="sticky top-[57px] z-35 bg-zinc-900/95 py-3 -mx-4 px-4 mb-6 border-b border-zinc-800">
      <div id="categoryPills" class="flex space-x-2 overflow-x-auto no-scrollbar py-1"></div>
    </div>
    <div id="menuContentBox" class="w-full"></div>
  </section>

  <!-- CART MODAL -->
  <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-zinc-900 w-full max-w-md h-full flex flex-col shadow-2xl p-4 space-y-4">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 class="font-bold text-lg text-white">Your Cart</h3>
        <button onclick="toggleCartModal()" class="text-white text-xl">&times;</button>
      </div>
      <div id="cartItemsList" class="flex-grow overflow-y-auto space-y-2 text-xs"></div>
      <div class="pt-3 border-t border-zinc-800 space-y-2 text-xs">
        <div class="flex justify-between"><span>Subtotal (Excl. GST)</span><span id="cartSubtotal">$0.00</span></div>
        <div class="flex justify-between"><span>GST (15% Included)</span><span id="cartGST">$0.00</span></div>
        <div class="flex justify-between font-bold text-base text-amber-400"><span>Total (NZD)</span><span id="cartTotal">$0.00</span></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="mainFooter" class="text-xs py-8 border-t border-zinc-800 mt-12 bg-black text-stone-400">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <h4 id="footerStoreName" class="font-bold text-sm mb-1 text-stone-200">Store Name</h4>
        <p id="footerAddress" class="mb-1 text-xs">Address...</p>
        <p class="text-xs">Phone: <a id="footerPhone" href="#" class="underline">Phone...</a></p>
      </div>
      <div>
        <h4 class="font-bold text-sm mb-1 text-stone-200"><i class="fa-solid fa-clock mr-1 text-amber-400"></i> Operating Hours</h4>
        <div id="footerOperatingHours" class="space-y-1 text-xs"><p>Loading hours...</p></div>
      </div>
      <div>
        <h4 class="font-bold text-sm mb-1 text-stone-200"><i class="fa-solid fa-toolbox mr-1 text-amber-400"></i> Quick Links</h4>
        <div class="flex flex-col space-y-1 text-xs">
          <a href="admin.html" class="text-amber-400 hover:underline"><i class="fa-solid fa-user-gear mr-1"></i> Open Manager Portal</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
      authDomain: "restosync-saas.firebaseapp.com",
      projectId: "restosync-saas",
      storageBucket: "restosync-saas.firebasestorage.app",
      messagingSenderId: "780544019719",
      appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const TENANT_ID = urlParams.get('tenant') || 'bangkokthaipalmy';

    let activeConfig = {};
    let currentFilter = 'ALL';
    let cart = [];

    document.addEventListener('DOMContentLoaded', () => {
      db.collection("tenants").doc(TENANT_ID).onSnapshot((doc) => {
        if (doc.exists && doc.data().config) {
          activeConfig = doc.data().config;
          
          // LISENSI DI-BYPASS (Tidak ada pemeriksaan tanggal kedaluwarsa)
          
          initStoreBranding();
          renderCategoryPills();
          renderMenuContentBox();
        }
      });
    });

    function initStoreBranding() {
      const store = activeConfig.store || {};
      const branding = activeConfig.branding || {};
      document.getElementById('heroTaglineTitle').innerText = store.name || 'Store Name';
      document.getElementById('bannerTagline').innerText = store.tagline || '';
      document.getElementById('footerStoreName').innerText = store.name || 'Store Name';
      document.getElementById('footerAddress').innerText = store.address || '';
      document.getElementById('footerPhone').innerText = store.phone || '';
      document.getElementById('footerPhone').href = `tel:${store.phone || ''}`;

      const op = activeConfig.operatingHours || {};
      const validDays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
      const hoursHtml = Object.keys(op)
        .filter(key => validDays.includes(key.toLowerCase()))
        .map(day => `<div class="flex justify-between capitalize"><span>${day}:</span><span class="text-stone-200">${op[day] || 'Closed'}</span></div>`)
        .join('');
      document.getElementById('footerOperatingHours').innerHTML = hoursHtml || '<p>Hours not set</p>';

      if (branding.logo) {
        document.getElementById('storeLogo').src = branding.logo;
      }
    }

    function renderCategoryPills() {
      const items = (activeConfig.menuItems || []).filter(i => !i.isHidden);
      const categories = [...new Set(items.map(i => i.category))];
      const pills = document.getElementById('categoryPills');
      pills.innerHTML = `<button onclick="filterCategory('ALL')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold ${currentFilter === 'ALL' ? 'bg-amber-500 text-zinc-950 font-bold' : 'bg-zinc-800 text-stone-300'}">ALL</button>` +
        categories.map(c => `<button onclick="filterCategory('${c}')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold ${currentFilter === c ? 'bg-amber-500 text-zinc-950 font-bold' : 'bg-zinc-800 text-stone-300'}">${c}</button>`).join('');
    }

    function filterCategory(cat) {
      currentFilter = cat;
      renderCategoryPills();
      renderMenuContentBox();
    }

    function renderMenuContentBox() {
      const items = (activeConfig.menuItems || []).filter(i => !i.isHidden && (currentFilter === 'ALL' || i.category === currentFilter));
      
      if (items.length === 0) {
        document.getElementById('menuContentBox').innerHTML = `<div class="text-center py-12 text-stone-500 text-xs">No menu items found.</div>`;
        return;
      }

      document.getElementById('menuContentBox').innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${items.map(item => {
            const hasPromo = item.promoPrice && Number(item.promoPrice) < Number(item.price);
            return `
              <div class="bg-zinc-800 rounded-2xl p-3.5 border border-zinc-700 flex flex-col justify-between shadow-lg text-xs">
                <div>
                  ${item.image ? `<div class="w-full h-36 bg-zinc-950 mb-3 rounded-xl overflow-hidden"><img src="${item.image}" class="w-full h-full object-cover"></div>` : ''}
                  <h3 class="font-bold text-stone-100 text-sm">${item.id}: ${item.name}</h3>
                  <p class="text-[11px] text-stone-400 mt-1">${item.description || ''}</p>
                  <div class="mt-2.5 flex items-baseline space-x-2">
                    <span class="${hasPromo ? 'line-through text-zinc-500 text-xs' : 'font-black text-amber-400 text-base'}">$${Number(item.price).toFixed(2)}</span>
                    ${hasPromo ? `<span class="font-black text-amber-400 text-base">$${Number(item.promoPrice).toFixed(2)}</span>` : ''}
                  </div>
                </div>
                <button onclick="addToCart('${item.id}')" class="mt-3 bg-amber-500 text-zinc-950 font-bold py-2 rounded-xl text-xs shadow w-full">Add to Order</button>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function addToCart(id) {
      const item = activeConfig.menuItems.find(i => i.id === id);
      if (!item) return;
      const finalPrice = item.promoPrice && Number(item.promoPrice) < Number(item.price) ? Number(item.promoPrice) : Number(item.price);
      cart.push({ ...item, price: finalPrice, qty: 1 });
      document.getElementById('cartCount').innerText = cart.length;
      updateCartUI();
    }

    function updateCartUI() {
      const total = cart.reduce((s,i)=>s+(i.price*i.qty),0);
      document.getElementById('cartSubtotal').innerText = `$${(total/1.15).toFixed(2)}`;
      document.getElementById('cartGST').innerText = `$${(total - total/1.15).toFixed(2)}`;
      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
      document.getElementById('cartItemsList').innerHTML = cart.map(i => `<div class="flex justify-between py-1 border-b border-zinc-800 text-stone-300 text-xs"><span>${i.name}</span><span class="text-amber-400 font-bold">$${i.price}</span></div>`).join('');
    }

    function toggleCartModal() {
      document.getElementById('cartModal').classList.toggle('hidden');
    }
  </script>
</body>
</html>
