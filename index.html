<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Debugging Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-stone-100 p-8">
  <div class="max-w-xl mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 space-y-4">
    <h1 class="text-xl font-bold text-amber-400">Panel Diagnostik RestoSync</h1>
    <p id="debug-status" class="text-sm text-stone-300">Menghubungkan ke Firebase Firestore...</p>
    <div id="debug-result" class="bg-zinc-950 p-4 rounded text-xs font-mono text-emerald-400 overflow-x-auto"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
      authDomain: "restosync-saas.firebaseapp.com",
      projectId: "restosync-saas",
      storageBucket: "restosync-saas.firebasestorage.app",
      messagingSenderId: "780544019719",
      appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const tenantId = urlParams.get('tenant') || 'bangkokthaipalmy';

    document.getElementById('debug-status').innerText = `Mencari Tenant ID: "${tenantId}" di database...`;

    db.collection('tenants').doc(tenantId).get().then((doc) => {
      if (doc.exists) {
        const rawData = doc.data();
        document.getElementById('debug-status').innerText = "SUKSES! Dokumen ditemukan di Firebase.";
        document.getElementById('debug-result').innerText = JSON.stringify(rawData, null, 2);
      } else {
        document.getElementById('debug-status').innerText = `GAGAL: Dokumen dengan ID "${tenantId}" tidak ditemukan di database!`;
        document.getElementById('debug-result').innerText = "Periksa kembali apakah nama dokumen di koleksi 'tenants' benar-benar 'bangkokthaipalmy'.";
      }
    }).catch((error) => {
      document.getElementById('debug-status').innerText = "TERJADI ERROR KONEKSI/IZIN KE FIREBASE:";
      document.getElementById('debug-result').innerText = error.message;
    });
  </script>
</body>
</html>
