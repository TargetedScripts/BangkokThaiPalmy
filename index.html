<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangkok Thai Takeaway • Powered by RestoSync SaaS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vgreen: {
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
            },
            navy: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between selection:bg-amber-500 selection:text-black">

  <!-- TOP HEADER & BRANDING -->
  <header class="bg-navy-900 border-b border-slate-800 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <img id="store-logo" src="Images/BangkokThaiLogo.png" alt="Bangkok Thai Takeaway Logo" class="h-10 sm:h-12 w-auto object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x50/0f172a/ffffff?text=Bangkok+Thai';" />
      <span id="store-header-title" class="hidden sm:inline-block font-extrabold text-amber-400 text-lg tracking-wide uppercase">
        TAKEAWAY
      </span>
    </div>

    <div class="flex items-center gap-3">
      <button id="layout-toggle-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-2 rounded-xl border border-slate-700 transition-all flex items-center gap-1.5">
        <span>📋</span> Classic
      </button>
      <a href="#cart" class="bg-amber-500 hover:bg-amber-400 text-black text-xs font-extrabold px-4 py-2 rounded-xl shadow-lg transition-all flex items-center gap-1.5">
        <span>🛒</span> Cart <span id="cart-count-badge" class="bg-black text-amber-400 text-[10px] px-1.5 py-0.5 rounded-full">0</span>
      </a>
    </div>
  </header>

  <!-- MAIN HERO & SLIDER SECTION -->
  <section class="relative bg-navy-900 border-b border-slate-800 py-8 sm:py-12 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
      
      <!-- Left Column: Store Branding Details -->
      <div class="lg:col-span-6 space-y-4 text-center lg:text-left">
        <div class="flex items-center justify-center lg:justify-start gap-2">
          <img src="Images/BangkokThaiLogo.png" class="h-12 w-auto object-contain mb-2" alt="Logo" />
        </div>
        <h1 id="hero-store-name" class="text-3xl sm:text-5xl font-black text-white tracking-tight">
          BANGKOK THAI TAKEAWAY
        </h1>
        <p id="hero-tagline" class="text-slate-400 text-sm sm:text-base">
          Authentic Thai Cuisine in Palmerston North
        </p>

        <div id="store-contact-pills" class="pt-2 flex flex-wrap items-center justify-center lg:justify-start gap-3 text-xs text-slate-300">
          <span class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/80 flex items-center gap-1.5">
            📍 <span id="hero-address">287 Main Street, Palmerston North</span>
          </span>
          <span class="bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700/80 flex items-center gap-1.5">
            📞 <span id="hero-phone">06 222 3375</span>
          </span>
        </div>
      </div>

      <!-- Right Column: Slide Images Carousel (Selalu Tampil Walau Teks Hero Kosong) -->
      <div class="lg:col-span-6">
        <div id="hero-slider-wrapper" class="relative w-full h-56 sm:h-72 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl bg-black">
          <div id="hero-slider-container" class="w-full h-full relative">
            <!-- Slide images dimuat otomatis via JavaScript -->
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- CATEGORY FILTER BAR -->
  <div class="sticky top-[65px] z-40 bg-navy-950/95 backdrop-blur-md border-b border-slate-800 py-3 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar text-xs font-bold">
      <button class="category-btn bg-amber-500 text-black px-4 py-2 rounded-xl shrink-0 shadow">ALL</button>
      <button class="category-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl shrink-0 border border-slate-700">❤️ Favorite</button>
      <button class="category-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl shrink-0 border border-slate-700">🏷️ Promo</button>
      <button class="category-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl shrink-0 border border-slate-700">Appetisers</button>
      <button class="category-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl shrink-0 border border-slate-700">Soup</button>
      <button class="category-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl shrink-0 border border-slate-700">Curry - Salad</button>
      <button class="category-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl shrink-0 border border-slate-700">Wok Dishes</button>
      <button class="category-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl shrink-0 border border-slate-700">Noodles &amp; Rice</button>
    </div>
  </div>

  <!-- MENU CATALOGUE CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8 flex-grow w-full">
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Item menu dirender dari katalog RestoSync -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-navy-900 border-t border-slate-800 py-6 px-4 text-center text-xs text-slate-500">
    <p>&copy; 2026 Bangkok Thai Takeaway. Powered by <strong class="text-amber-400">RestoSync SaaS</strong> by TargetedScripts.com</p>
  </footer>

  <!-- FRONTEND CLIENT ENGINE SCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        loadAdminCustomizations();
        initHeroSliderEngine();
    });

    // 1. Terapkan Warna & Informasi dari Admin Screen
    function loadAdminCustomizations() {
        const savedAdmin = localStorage.getItem('restoSync_admin_settings');
        if (savedAdmin) {
            const data = JSON.parse(savedAdmin);
            
            if (data.storeName && document.getElementById('hero-store-name')) {
                document.getElementById('hero-store-name').textContent = data.storeName;
            }
            if (data.tagline && document.getElementById('hero-tagline')) {
                document.getElementById('hero-tagline').textContent = data.tagline;
            }
            if (data.phone && document.getElementById('hero-phone')) {
                document.getElementById('hero-phone').textContent = data.phone;
            }
            if (data.address && document.getElementById('hero-address')) {
                document.getElementById('hero-address').textContent = data.address;
            }
        }
    }

    // 2. Engine Slider Gambar Hero (Tetap Aktif Otomatis)
    function initHeroSliderEngine() {
        const sliderContainer = document.getElementById('hero-slider-container');
        if (!sliderContainer) return;

        // Ambil array gambar kustom atau gunakan gambar fallback banner
        const savedConfig = JSON.parse(localStorage.getItem('restoSync_admin_settings') || '{}');
        const heroImages = (savedConfig.heroImages && savedConfig.heroImages.length > 0)
            ? savedConfig.heroImages
            : [
                'Images/banner1.jpg',
                'Images/banner2.jpg',
                'Images/banner3.jpg'
              ];

        if (heroImages.length > 0) {
            sliderContainer.innerHTML = heroImages.map((imgUrl, index) => `
                <div class="hero-slide ${index === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'} transition-opacity duration-1000 ease-in-out absolute inset-0">
                    <img src="${imgUrl}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x400/0f172a/ffffff?text=Bangkok+Thai+Special';" alt="Hero Banner ${index + 1}" />
                </div>
            `).join('');

            // Rotasi gambar otomatis setiap 4 detik
            let currentIdx = 0;
            const slides = sliderContainer.querySelectorAll('.hero-slide');
            
            if (slides.length > 1) {
                setInterval(() => {
                    slides[currentIdx].classList.remove('opacity-100', 'z-10');
                    slides[currentIdx].classList.add('opacity-0', 'z-0');

                    currentIdx = (currentIdx + 1) % slides.length;

                    slides[currentIdx].classList.remove('opacity-0', 'z-0');
                    slides[currentIdx].classList.add('opacity-100', 'z-10');
                }, 4000);
            }
        }
    }
  </script>

</body>
</html>
