<!-- ADMIN CARD: STORE OPERATING HOURS & EMERGENCY CLOSURE -->
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-4">
  <h2 class="font-bold text-sm text-stone-100 border-b border-zinc-800 pb-3 flex items-center">
    <i class="fa-solid fa-clock text-amber-400 mr-2"></i> Operating Hours & Holiday Closures
  </h2>
  
  <div class="space-y-3 text-xs">
    <div>
      <label class="block text-stone-400 mb-1">Weekday Hours (Mon - Sat)</label>
      <input type="text" id="cfgWeekdayHours" value="Mon - Sat: 4:30 PM - 9:00 PM" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100">
    </div>

    <!-- HOLIDAY SURCHARGE SETTINGS -->
    <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 space-y-2">
      <label class="flex items-center justify-between cursor-pointer">
        <span class="font-bold text-amber-300">Enable Holiday Surcharge Today</span>
        <input type="checkbox" id="cfgHasSurcharge" class="w-4 h-4 accent-amber-500 rounded">
      </label>
      <div class="grid grid-cols-2 gap-2 pt-1">
        <div>
          <label class="block text-[10px] text-stone-400">Surcharge Name</label>
          <input type="text" id="cfgSurchargeName" value="Public Holiday Surcharge" class="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-stone-100">
        </div>
        <div>
          <label class="block text-[10px] text-stone-400">Surcharge %</label>
          <input type="number" id="cfgSurchargePercent" value="15" class="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-amber-400 font-bold">
        </div>
      </div>
    </div>

    <!-- EMERGENCY / VACATION CLOSURE SETTINGS -->
    <div class="bg-red-950/40 p-3 rounded-xl border border-red-800/50 space-y-2">
      <label class="flex items-center justify-between cursor-pointer">
        <span class="font-bold text-red-400">Close Store Totally (Vacation / Emergency)</span>
        <input type="checkbox" id="cfgIsTotallyClosed" class="w-4 h-4 accent-red-500 rounded">
      </label>
      <div>
        <label class="block text-[10px] text-stone-400 mb-1">Closure Modal Title</label>
        <input type="text" id="cfgClosureTitle" value="Store Closed for Holidays" class="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-stone-100">
      </div>
      <div>
        <label class="block text-[10px] text-stone-400 mb-1">Closure Notice Message</label>
        <textarea id="cfgClosureMessage" rows="2" class="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-stone-100">We are currently away on annual holidays. Thank you for your support!</textarea>
      </div>
      <div>
        <label class="block text-[10px] text-amber-400 font-semibold mb-1">Re-opening Date Info</label>
        <input type="text" id="cfgReopenDate" placeholder="Monday, 15 Nov" class="w-full bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-stone-100">
      </div>
    </div>
  </div>
</div>
