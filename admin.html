<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Manager Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-zinc-950 text-stone-200 min-h-screen flex flex-col">

  <!-- TOP BAR -->
  <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-amber-500 text-zinc-950 rounded-xl flex items-center justify-center font-black"><i class="fa-solid fa-utensils"></i></div>
      <div>
        <h1 class="font-bold text-white text-base">RestoSync Manager Portal</h1>
        <p class="text-xs text-stone-400">Tenant: <span id="currentTenantId" class="text-amber-400 font-mono">bangkokthaipalmy</span></p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <a href="index.html?tenant=bangkokthaipalmy" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-stone-200 px-4 py-2 rounded-xl text-xs font-bold border border-zinc-700 flex items-center space-x-2">
        <i class="fa-solid fa-eye text-amber-400"></i><span>View Live Store</span>
      </a>
      <button onclick="saveConfigToFirebase()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 px-5 py-2 rounded-xl text-xs font-black shadow-lg flex items-center space-x-2">
        <i class="fa-solid fa-floppy-disk"></i><span>Save Changes</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-6 py-8 w-full flex-grow space-y-8">
    
    <!-- NOTIFICATION BANNER -->
    <div id="saveNotification" class="hidden bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 px-4 py-3 rounded-2xl text-xs flex items-center space-x-3">
      <i class="fa-solid fa-circle-check text-base"></i>
      <span id="saveNotifText">Konfigurasi berhasil disimpan ke Firebase Firestore!</span>
    </div>

    <!-- STORE PROFILE & BRANDING SECTION -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 space-y-6 shadow-xl">
      <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center space-x-2">
        <i class="fa-solid fa-store"></i><span>Store Information & Branding</span>
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
        <div>
          <label class="block text-stone-400 mb-1 font-semibold">Store Name</label>
          <input type="text" id="inputStoreName" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-stone-200 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-stone-400 mb-1 font-semibold">Tagline</label>
          <input type="text" id="inputStoreTagline" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-stone-200 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-stone-400 mb-1 font-semibold">Phone Number</label>
          <input type="text" id="inputStorePhone" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-stone-200 focus:outline-none focus:border-amber-500">
        </div>
        <div class="md:col-span-2">
          <label class="block text-stone-400 mb-1 font-semibold">Physical Address</label>
          <input type="text" id="inputStoreAddress" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-stone-200 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-stone-400 mb-1 font-semibold">Logo Image URL</label>
          <input type="text" id="inputStoreLogo" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-stone-200 focus:outline-none focus:border-amber-500" placeholder="./assets/images/logo.png">
        </div>
      </div>
    </div>

    <!-- MENU MANAGEMENT SECTION -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 space-y-6 shadow-xl">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center space-x-2">
          <i class="fa-solid fa-utensils"></i><span>Menu Catalogue Management</span>
        </h2>
        <button onclick="addNewMenuItem()" class="bg-zinc-800 hover:bg-zinc-700 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold border border-zinc-700 flex items-center space-x-1.5">
          <i class="fa-solid fa-plus"></i><span>Add New Menu Item</span>
        </button>
      </div>

      <div id="adminMenuList" class="space-y-4">
        <!-- Dynamic Menu List Generated Here -->
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-black border-t border-zinc-900 py-6 text-center text-xs text-stone-500">
    RestoSync SaaS Enterprise Manager Portal &bull; Secured via Firebase Firestore
  </footer>

  <!-- FIREBASE & ADMIN LOGIC -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
      authDomain: "restosync-saas.firebaseapp.com",
      projectId: "restosync-saas",
      storageBucket: "restosync-saas.firebasestorage.app",
      messagingSenderId: "780544019719",
      appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const TENANT_ID = urlParams.get('tenant') || 'bangkokthaipalmy';
    document.getElementById('currentTenantId').innerText = TENANT_ID;

    let activeConfig = {};

    document.addEventListener('DOMContentLoaded', () => {
      db.collection("tenants").doc(TENANT_ID).get().then((doc) => {
        if (doc.exists && doc.data().config) {
          activeConfig = doc.data().config;
          populateAdminForm();
        } else {
          alert("Konfigurasi tenant tidak ditemukan di database.");
        }
      }).catch(err => {
        console.error("Error loading config:", err);
      });
    });

    function populateAdminForm() {
      const store = activeConfig.store || {};
      const branding = activeConfig.branding || {};

      document.getElementById('inputStoreName').value = store.name || '';
      document.getElementById('inputStoreTagline').value = store.tagline || '';
      document.getElementById('inputStorePhone').value = store.phone || '';
      document.getElementById('inputStoreAddress').value = store.address || '';
      document.getElementById('inputStoreLogo').value = branding.logo || '';

      renderAdminMenuList();
    }

    function renderAdminMenuList() {
      const items = activeConfig.menuItems || [];
      const container = document.getElementById('adminMenuList');

      if (items.length === 0) {
        container.innerHTML = `<p class="text-xs text-stone-500 text-center py-4">Belum ada menu item.</p>`;
        return;
      }

      container.innerHTML = items.map((item, idx) => `
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 grid grid-cols-1 md:grid-cols-6 gap-4 items-center text-xs">
          <div>
            <label class="block text-stone-500 text-[10px] mb-1">ID</label>
            <input type="text" value="${item.id || ''}" onchange="updateItemField(${idx}, 'id', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1 text-stone-200 font-mono">
          </div>
          <div class="md:col-span-2">
            <label class="block text-stone-500 text-[10px] mb-1">Name</label>
            <input type="text" value="${item.name || ''}" onchange="updateItemField(${idx}, 'name', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1 text-stone-200">
          </div>
          <div>
            <label class="block text-stone-500 text-[10px] mb-1">Category</label>
            <input type="text" value="${item.category || ''}" onchange="updateItemField(${idx}, 'category', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1 text-stone-200">
          </div>
          <div>
            <label class="block text-stone-500 text-[10px] mb-1">Price ($)</label>
            <input type="number" step="0.01" value="${item.price || 0}" onchange="updateItemField(${idx}, 'price', parseFloat(this.value))" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1 text-stone-200">
          </div>
          <div class="flex justify-end items-center space-x-2 pt-4">
            <label class="flex items-center space-x-1 cursor-pointer text-stone-400">
              <input type="checkbox" ${item.isHidden ? 'checked' : ''} onchange="updateItemField(${idx}, 'isHidden', this.checked)" class="rounded bg-zinc-900 border-zinc-700 text-amber-500">
              <span>Hide</span>
            </label>
            <button onclick="removeMenuItem(${idx})" class="bg-red-950/60 hover:bg-red-900 text-red-400 px-2.5 py-1.5 rounded-lg border border-red-900/50"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function updateItemField(idx, field, val) {
      if (activeConfig.menuItems[idx]) {
        activeConfig.menuItems[idx][field] = val;
      }
    }

    function addNewMenuItem() {
      if (!activeConfig.menuItems) activeConfig.menuItems = [];
      activeConfig.menuItems.push({
        id: "M" + (activeConfig.menuItems.length + 1),
        name: "New Menu Item",
        category: "Appetisers",
        price: 12.50,
        description: "Delicious freshly prepared dish.",
        isHidden: false
      });
      renderAdminMenuList();
    }

    function removeMenuItem(idx) {
      if (confirm("Apakah Anda yakin ingin menghapus menu ini?")) {
        activeConfig.menuItems.splice(idx, 1);
        renderAdminMenuList();
      }
    }

    function saveConfigToFirebase() {
      // Gather general store details from inputs
      if (!activeConfig.store) activeConfig.store = {};
      if (!activeConfig.branding) activeConfig.branding = {};

      activeConfig.store.name = document.getElementById('inputStoreName').value;
      activeConfig.store.tagline = document.getElementById('inputStoreTagline').value;
      activeConfig.store.phone = document.getElementById('inputStorePhone').value;
      activeConfig.store.address = document.getElementById('inputStoreAddress').value;
      activeConfig.branding.logo = document.getElementById('inputStoreLogo').value;

      db.collection("tenants").doc(TENANT_ID).update({
        config: activeConfig
      }).then(() => {
        const notif = document.getElementById('saveNotification');
        notif.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => notif.classList.add('hidden'), 4000);
      }).catch(err => {
        console.error("Error saving:", err);
        alert("Gagal menyimpan ke Firebase: " + err.message);
      });
    }
  </script>
</body>
</html>
