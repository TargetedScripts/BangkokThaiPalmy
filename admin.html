<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Universal Admin Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body class="bg-zinc-950 text-stone-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Admin Header -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <span class="text-amber-500 text-xl"><i class="fa-solid fa-shield-halved"></i></span>
      <h1 class="font-bold text-lg text-amber-400">RestoSync Enterprise Admin Portal</h1>
    </div>
    <div class="flex items-center space-x-3">
      <a id="view-live-btn" href="./index.html" target="_blank" class="bg-zinc-800 hover:bg-zinc-700 text-stone-200 px-3 py-1.5 rounded-lg text-xs font-semibold border border-zinc-700 flex items-center space-x-1.5">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        <span>View Live Store</span>
      </a>
    </div>
  </header>

  <!-- Main Admin Container -->
  <main class="flex-grow max-w-5xl w-full mx-auto p-6 space-y-6">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow space-y-4">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
        <div>
          <h2 class="font-bold text-base text-stone-100">Store Profile & Configuration</h2>
          <p class="text-xs text-stone-400">Edit store information, operating hours, and broadcast updates instantly to Firestore.</p>
        </div>
        <button id="save-btn" onclick="window.saveConfiguration()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-4 py-2 rounded-lg text-xs shadow transition flex items-center space-x-1.5">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>Save All Changes</span>
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-stone-300 mb-1">Store Name</label>
          <input type="text" id="input-name" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-300 mb-1">Tagline</label>
          <input type="text" id="input-tagline" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-300 mb-1">Phone</label>
          <input type="text" id="input-phone" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-300 mb-1">Address</label>
          <input type="text" id="input-address" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-stone-100 focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="pt-4 border-t border-zinc-800">
        <h3 class="font-bold text-sm text-stone-200 mb-2">JSON Raw Configuration Preview</h3>
        <p class="text-xs text-stone-400 mb-2">Seluruh konfigurasi terstruktur disimpan dalam format JSON di bawah ini:</p>
        <textarea id="json-config-area" rows="8" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-xs font-mono text-amber-300 focus:outline-none focus:border-amber-500"></textarea>
      </div>
    </div>
  </main>

  <!-- Firebase SDKs (Compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Admin Script Logic -->
  <script type="module">
    import { TenantLoader } from './assets/js/core/tenant-loader.js';
    import { AppState } from './assets/js/core/state.js';
    import { db } from './assets/js/core/firebase-init.js';

    let currentTenantDocId = "";

    window.saveConfiguration = async function() {
      try {
        const jsonText = document.getElementById('json-config-area').value;
        const parsedConfig = JSON.parse(jsonText);

        // Update local state inputs if modified
        parsedConfig.store.name = document.getElementById('input-name').value;
        parsedConfig.store.tagline = document.getElementById('input-tagline').value;
        parsedConfig.store.phone = document.getElementById('input-phone').value;
        parsedConfig.store.address = document.getElementById('input-address').value;

        const docRef = db.collection('tenants').doc(currentTenantDocId);
        await docRef.set({
          tenantId: currentTenantDocId,
          config: parsedConfig,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        alert("Konfigurasi berhasil disimpan dan disiarkan secara real-time ke Firestore!");
      } catch (err) {
        console.error("Gagal menyimpan konfigurasi:", err);
        alert("Terjadi kesalahan saat mem-parsing JSON atau menyimpan ke Firestore.");
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      currentTenantDocId = TenantLoader.resolveTenantId();
      document.getElementById('view-live-btn.href', `./index.html?tenant=${currentTenantDocId}`);

      TenantLoader.initTenantListener((data) => {
        const config = data.config || {};
        document.getElementById('input-name').value = config.store?.name || '';
        document.getElementById('input-tagline').value = config.store?.tagline || '';
        document.getElementById('input-phone').value = config.store?.phone || '';
        document.getElementById('input-address').value = config.store?.address || '';
        document.getElementById('json-config-area').value = JSON.stringify(config, null, 2);
      });
    });
  </script>
</body>
</html>
