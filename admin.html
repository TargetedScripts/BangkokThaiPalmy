<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RestoSync SaaS - Management Portal (Owner & Admin)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-950 text-stone-200 min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-zinc-950">

  <!-- TOPNAV BAR -->
  <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 w-full">
    <div class="w-full px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3 shrink-0">
        <span class="text-xs text-amber-400 font-bold uppercase tracking-wider">RestoSync SaaS Admin Portal</span>
        <span id="activeTenantBadge" class="bg-zinc-800 text-stone-300 text-[10px] px-2 py-0.5 rounded font-mono">Tenant: Loading...</span>
      </div>

      <div class="flex items-center space-x-3 shrink-0">
        <a id="liveStoreLink" href="index.html" target="_blank" class="text-xs font-semibold text-amber-400 hover:text-amber-300 transition flex items-center space-x-1 border border-amber-500/30 bg-amber-500/10 px-3 py-1.5 rounded-lg">
          <i class="fa-solid fa-arrow-up-right-from-square"></i><span>View Live Store</span>
        </a>
        <button onclick="saveAllChanges()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-5 py-1.5 rounded-lg text-xs shadow transition flex items-center space-x-1">
          <i class="fa-solid fa-floppy-disk"></i><span>Save All Changes</span>
        </button>
      </div>
    </div>

    <!-- TAB NAVIGATION -->
    <div class="bg-zinc-950 border-t border-zinc-800 px-4 sm:px-6 flex space-x-2 overflow-x-auto no-scrollbar text-xs font-semibold">
      <button id="tabBtn-profile" onclick="switchAdminTab('profile')" class="py-3 px-4 text-amber-400 border-b-2 border-amber-400 flex items-center space-x-2 transition whitespace-nowrap"><i class="fa-solid fa-store"></i><span>Store Info & Hours</span></button>
      <button id="tabBtn-theme" onclick="switchAdminTab('theme')" class="py-3 px-4 text-stone-400 border-b-2 border-transparent hover:text-stone-200 flex items-center space-x-2 transition whitespace-nowrap"><i class="fa-solid fa-palette"></i><span>Theme, Logo & Colors</span></button>
      <button id="tabBtn-menu" onclick="switchAdminTab('menu')" class="py-3 px-4 text-stone-400 border-b-2 border-transparent hover:text-stone-200 flex items-center space-x-2 transition whitespace-nowrap"><i class="fa-solid fa-utensils"></i><span>Menu Catalogue</span></button>
      <button id="tabBtn-console" onclick="switchAdminTab('console')" class="py-3 px-4 text-stone-400 border-b-2 border-transparent hover:text-stone-200 flex items-center space-x-2 transition whitespace-nowrap"><i class="fa-solid fa-shield text-amber-400"></i><span class="text-amber-400">AES-256 License</span></button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
    
    <!-- TAB 1: PROFILE & OPERATING HOURS -->
    <div id="tabContent-profile" class="tab-panel space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-4">
          <h2 class="font-bold text-sm text-stone-100 border-b border-zinc-800 pb-3 flex items-center"><i class="fa-solid fa-store text-amber-400 mr-2"></i> Restaurant Profile</h2>
          <div class="space-y-3 text-xs">
            <div><label class="block text-stone-400 mb-1">Restaurant Name</label><input type="text" id="cfgStoreName" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1">Tagline</label><input type="text" id="cfgTagline" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1">Phone Number</label><input type="text" id="cfgPhone" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1">Address</label><textarea id="cfgAddress" rows="2" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></textarea></div>
          </div>
        </div>

        <div class="lg:col-span-2 bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-4">
          <h2 class="font-bold text-sm text-stone-100 border-b border-zinc-800 pb-3 flex items-center">
            <i class="fa-solid fa-clock text-amber-400 mr-2"></i> Operating Hours
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
            <div><label class="block text-stone-400 mb-1 font-semibold">Monday</label><input type="text" id="hoursMon" placeholder="e.g. 4:30 PM - 9:30 PM or Closed" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1 font-semibold">Tuesday</label><input type="text" id="hoursTue" placeholder="e.g. 4:30 PM - 9:30 PM or Closed" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1 font-semibold">Wednesday</label><input type="text" id="hoursWed" placeholder="e.g. 4:30 PM - 9:30 PM or Closed" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1 font-semibold">Thursday</label><input type="text" id="hoursThu" placeholder="e.g. 4:30 PM - 9:30 PM or Closed" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1 font-semibold">Friday</label><input type="text" id="hoursFri" placeholder="e.g. 4:30 PM - 9:30 PM or Closed" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div><label class="block text-stone-400 mb-1 font-semibold">Saturday</label><input type="text" id="hoursSat" placeholder="e.g. 4:30 PM - 9:30 PM or Closed" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
            <div class="md:col-span-2"><label class="block text-amber-400 mb-1 font-semibold">Sunday</label><input type="text" id="hoursSun" placeholder="e.g. 4:30 PM - 9:30 PM or Closed" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-stone-100"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 2: THEME & COLORS -->
    <div id="tabContent-theme" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-4">
          <h2 class="font-bold text-sm text-stone-100 border-b border-zinc-800 pb-3 flex items-center"><i class="fa-solid fa-image text-amber-400 mr-2"></i> Client Logo Management</h2>
          <div class="space-y-3 text-xs">
            <div><label class="block text-stone-400 mb-1">Upload Logo</label><input type="file" id="logoFileInput" accept="image/*" onchange="handleLogoUpload(event)" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-1.5 text-stone-300"></div>
            <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 flex flex-col items-center justify-center space-y-2">
              <img id="logoPreview" src="" alt="Logo" class="object-contain" style="height: 48px;">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 3: MENU -->
    <div id="tabContent-menu" class="tab-panel hidden space-y-6">
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-4">
        <h2 class="font-bold text-sm text-stone-100 border-b border-zinc-800 pb-3 flex items-center"><i class="fa-solid fa-utensils text-amber-400 mr-2"></i> Menu Management</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-stone-300">
            <thead class="bg-zinc-950 text-stone-400 border-b border-zinc-800 uppercase font-semibold">
              <tr>
                <th class="py-3 px-2 text-center">Hero</th>
                <th class="py-3 px-2 text-center">Promo</th>
                <th class="py-3 px-3">Name</th>
                <th class="py-3 px-3">Price</th>
              </tr>
            </thead>
            <tbody id="adminMenuTableBody" class="divide-y divide-zinc-800/60"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 4: LICENSE -->
    <div id="tabContent-console" class="tab-panel hidden space-y-6">
      <div class="bg-zinc-900 border border-amber-500/30 rounded-2xl p-5 shadow-lg space-y-4">
        <h2 class="font-bold text-sm text-amber-400 flex items-center"><i class="fa-solid fa-shield-halved mr-2"></i> AES-256 License Token</h2>
        <textarea id="cfgLicenseToken" rows="4" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-amber-400 font-mono text-xs"></textarea>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCMd3tOM2g8FNL96UIlGRE9cbq3UUvssrQ",
      authDomain: "restosync-saas.firebaseapp.com",
      projectId: "restosync-saas",
      storageBucket: "restosync-saas.firebasestorage.app",
      messagingSenderId: "780544019719",
      appId: "1:780544019719:web:e5fccb00a4981f2579c9a2"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const TENANT_ID = urlParams.get('tenant') || 'bangkokthaipalmy';
    let activeConfig = {};

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('activeTenantBadge').innerText = `Tenant: ${TENANT_ID}`;
      db.collection("tenants").doc(TENANT_ID).onSnapshot((doc) => {
        if (doc.exists && doc.data().config) {
          activeConfig = doc.data().config;
          populateAdminForm();
          renderAdminMenuTable();
        }
      });
    });

    function switchAdminTab(tabId) {
      ['profile', 'theme', 'menu', 'console'].forEach(t => {
        document.getElementById(`tabBtn-${t}`).className = "py-3 px-4 text-stone-400 border-b-2 border-transparent hover:text-stone-200 flex items-center space-x-2 transition whitespace-nowrap";
        document.getElementById(`tabContent-${t}`).classList.add('hidden');
      });
      document.getElementById(`tabBtn-${tabId}`).className = "py-3 px-4 text-amber-400 border-b-2 border-amber-400 flex items-center space-x-2 transition font-bold whitespace-nowrap";
      document.getElementById(`tabContent-${tabId}`).classList.remove('hidden');
    }

    function populateAdminForm() {
      if (!activeConfig.store) return;
      document.getElementById('cfgStoreName').value = activeConfig.store.name || '';
      document.getElementById('cfgTagline').value = activeConfig.store.tagline || '';
      document.getElementById('cfgPhone').value = activeConfig.store.phone || '';
      document.getElementById('cfgAddress').value = activeConfig.store.address || '';

      // Sinkronisasi Jam Operasional
      const op = activeConfig.operatingHours || {};
      ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].forEach(d => {
        const inputEl = document.getElementById(`hours${d.charAt(0).toUpperCase() + d.slice(1)}`);
        if (inputEl) inputEl.value = op[d] || '';
      });

      document.getElementById('logoPreview').src = activeConfig.branding?.logo || '';
      document.getElementById('cfgLicenseToken').value = activeConfig.licenseToken || '';
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('logoPreview').src = e.target.result;
        if (!activeConfig.branding) activeConfig.branding = {};
        activeConfig.branding.logo = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderAdminMenuTable() {
      const tbody = document.getElementById('adminMenuTableBody');
      const items = activeConfig.menuItems || [];
      tbody.innerHTML = items.map((item, idx) => `
        <tr class="hover:bg-zinc-800/40 transition">
          <td class="py-3 px-2 text-center"><input type="checkbox" ${item.isHero ? 'checked' : ''} onchange="toggleFlag(${idx}, 'isHero')"></td>
          <td class="py-3 px-2 text-center"><input type="checkbox" ${item.isPromo ? 'checked' : ''} onchange="toggleFlag(${idx}, 'isPromo')"></td>
          <td class="py-3 px-3 font-bold text-stone-100">${item.id}: ${item.name}</td>
          <td class="py-3 px-3">$${Number(item.price).toFixed(2)}</td>
        </tr>
      `).join('');
    }

    function toggleFlag(idx, key) {
      activeConfig.menuItems[idx][key] = !activeConfig.menuItems[idx][key];
    }

    async function saveAllChanges() {
      activeConfig.store.name = document.getElementById('cfgStoreName').value;
      activeConfig.store.tagline = document.getElementById('cfgTagline').value;
      activeConfig.store.phone = document.getElementById('cfgPhone').value;
      activeConfig.store.address = document.getElementById('cfgAddress').value;

      // Simpan Jam Operasional ke Database
      activeConfig.operatingHours = {
        mon: document.getElementById('hoursMon').value,
        tue: document.getElementById('hoursTue').value,
        wed: document.getElementById('hoursWed').value,
        thu: document.getElementById('hoursThu').value,
        fri: document.getElementById('hoursFri').value,
        sat: document.getElementById('hoursSat').value,
        sun: document.getElementById('hoursSun').value
      };

      activeConfig.licenseToken = document.getElementById('cfgLicenseToken').value.trim();

      try {
        await db.collection("tenants").doc(TENANT_ID).set({ config: activeConfig, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        alert('Semua perubahan berhasil disimpan!');
      } catch (e) { alert('Gagal menyimpan.'); }
    }
  </script>
</body>
</html>
