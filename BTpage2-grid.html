<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangkok Thai - Menu (Modern Grid Demo)</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 flex flex-col min-h-screen selection:bg-red-700 selection:text-white">

  <!-- HEADER (Deep Thai Ruby) -->
  <header class="bg-red-900 text-white shadow-xl sticky top-0 z-40 border-b border-red-950">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-3 hover:opacity-90 transition">
          <img id="storeLogo" src="" alt="Logo" class="h-10 w-auto object-contain drop-shadow">
          <span class="font-bold text-xl tracking-wider text-rose-200 uppercase">Takeaway</span>
        </a>
      </div>
      
      <div class="flex items-center space-x-3">
        <a href="page3-classic.html" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-red-950 hover:bg-black text-rose-100 border border-red-800/50 transition flex items-center space-x-1.5">
          <i class="fa-solid fa-book-open text-rose-300"></i>
          <span class="hidden sm:inline">Try Classic View</span>
        </a>
        <button onclick="toggleCartModal()" class="relative bg-rose-700 hover:bg-rose-600 text-white font-bold px-4 py-2 rounded-lg text-sm flex items-center space-x-2 transition shadow-md">
          <i class="fa-solid fa-basket-shopping"></i>
          <span>Cart</span>
          <span id="cartCount" class="bg-stone-900 text-rose-300 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN MENU CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <!-- Header Banner -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-2 border-b border-stone-800 pb-4">
      <div>
        <h2 class="text-2xl font-bold text-stone-100">Modern Grid Demo</h2>
        <p class="text-xs text-stone-400">Deep Thai Ruby & Warm Slate Theme</p>
      </div>
      <a href="index.html" class="text-xs font-semibold text-rose-400 hover:underline flex items-center space-x-1">
        <i class="fa-solid fa-arrow-left"></i> <span>Back to Homepage</span>
      </a>
    </div>

    <!-- CATEGORY PILLS -->
    <div class="sticky top-[61px] z-30 bg-stone-900/95 backdrop-blur-md py-3 -mx-4 px-4 shadow-lg mb-6 border-b border-stone-800">
      <div id="categoryPills" class="flex space-x-2 overflow-x-auto no-scrollbar py-1"></div>
    </div>

    <!-- GRID CONTAINER -->
    <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- CART MODAL -->
  <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-stone-900 w-full max-w-md h-full flex flex-col shadow-2xl border-l border-stone-800">
      <div class="p-4 bg-red-900 text-white flex justify-between items-center shadow-md">
        <h3 class="font-bold text-lg flex items-center"><i class="fa-solid fa-cart-shopping mr-2 text-rose-300"></i> Your Takeaway Order</h3>
        <button onclick="toggleCartModal()" class="text-stone-300 hover:text-white text-2xl font-bold transition">&times;</button>
      </div>
      <div id="cartItemsList" class="flex-grow p-4 overflow-y-auto space-y-4 divide-y divide-stone-800">
        <p class="text-center text-stone-500 py-8">Your cart is empty.</p>
      </div>
      <div class="p-4 border-t border-stone-800 bg-stone-950 space-y-3">
        <div class="flex justify-between text-sm text-stone-400"><span>Subtotal</span><span id="cartSubtotal" class="text-stone-200">$0.00</span></div>
        <div class="flex justify-between text-sm text-stone-400"><span>GST (15% Included)</span><span id="cartGST" class="text-stone-200">$0.00</span></div>
        <div class="flex justify-between text-lg font-bold text-stone-100 pt-2 border-t border-stone-800"><span>Total (NZD)</span><span id="cartTotal" class="text-rose-400">$0.00</span></div>
        <button onclick="alert('Demo: Order submitted!')" class="w-full bg-rose-700 hover:bg-rose-800 text-white py-3.5 rounded-xl font-bold text-center transition shadow-lg">Submit Order</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-black text-stone-500 text-xs py-8 mt-auto border-t border-stone-900">
    <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
      <p id="footerStoreInfo">Bangkok Thai Takeaway | Palmerston North, NZ</p>
      <p>Powered by <strong class="text-stone-400">RestoSync SaaS</strong> &copy; 2026 TargetedScripts.com</p>
    </div>
  </footer>

  <script src="assets/js/bangkokthaipalmy.js"></script>
  <script>
    let currentCategory = 'ALL';
    let cart = [];

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof RESTOSYNC_CONFIG === 'undefined') return;
      document.getElementById('storeLogo').src = RESTOSYNC_CONFIG.branding.logo;
      document.getElementById('footerStoreInfo').innerText = `${RESTOSYNC_CONFIG.store.name} | ${RESTOSYNC_CONFIG.store.address} | Phone: ${RESTOSYNC_CONFIG.store.phone}`;
      renderCategoryPills();
      renderMenu();
    });

    function renderCategoryPills() {
      const categories = ['ALL', ...new Set(RESTOSYNC_CONFIG.menuItems.map(item => item.category))];
      document.getElementById('categoryPills').innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition border ${cat === currentCategory ? 'bg-rose-700 text-white border-rose-600 shadow-md font-bold' : 'bg-stone-800 text-stone-300 border-stone-700 hover:bg-stone-700'}">
          ${cat}
        </button>
      `).join('');
    }

    function filterCategory(cat) { currentCategory = cat; renderCategoryPills(); renderMenu(); }

    function renderMenu() {
      const items = currentCategory === 'ALL' ? RESTOSYNC_CONFIG.menuItems : RESTOSYNC_CONFIG.menuItems.filter(i => i.category === currentCategory);
      document.getElementById('menuContainer').innerHTML = items.map(item => `
        <div class="bg-stone-800/90 rounded-2xl shadow-lg hover:shadow-2xl transition overflow-hidden border border-stone-700/70 flex flex-col justify-between group">
          <div>
            ${item.image ? `<div class="overflow-hidden"><img src="${item.image}" alt="${item.name}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-500"></div>` : `<div class="w-full h-36 bg-stone-900 flex items-center justify-center text-stone-500 text-xs italic"><i class="fa-solid fa-utensils mr-2"></i> ${RESTOSYNC_CONFIG.store.name}</div>`}
            <div class="p-4">
              <div class="flex justify-between items-start gap-2">
                <h3 class="font-bold text-stone-100 text-base leading-snug">${item.id}: ${item.name}</h3>
                <span class="font-extrabold text-rose-400 text-base flex-shrink-0">$${item.price.toFixed(2)}</span>
              </div>
              <p class="text-xs text-stone-400 mt-1.5 line-clamp-2 leading-relaxed">${item.description}</p>
              ${getSpiceBadge(item.spiceLevel)}
            </div>
          </div>
          <div class="p-4 pt-0">
            <button onclick="addToCart('${item.id}')" class="w-full bg-red-950/70 hover:bg-rose-800 text-rose-200 hover:text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-1.5 border border-red-800/60 shadow-sm">
              <i class="fa-solid fa-plus"></i> <span>Add to Order</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    function getSpiceBadge(level) {
      if (!level || level === 0) return '';
      return `<div class="mt-2.5 flex items-center space-x-1">${'<i class="fa-solid fa-pepper-hot text-rose-500 text-xs"></i>'.repeat(level)}</div>`;
    }

    function addToCart(id) {
      const item = RESTOSYNC_CONFIG.menuItems.find(i => i.id === id);
      const ex = cart.find(c => c.id === id);
      if (ex) ex.qty++; else cart.push({...item, qty:1});
      updateCartUI();
    }

    function updateCartQty(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx !== -1) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
      }
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+i.qty,0);
      const subtotal = cart.reduce((s,i)=>s+(i.price*i.qty),0);
      document.getElementById('cartSubtotal').innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById('cartGST').innerText = `$${(subtotal*RESTOSYNC_CONFIG.store.gstRate).toFixed(2)}`;
      document.getElementById('cartTotal').innerText = `$${subtotal.toFixed(2)}`;
      
      const itemsList = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        itemsList.innerHTML = `<p class="text-center text-stone-500 py-8">Your cart is empty.</p>`;
      } else {
        itemsList.innerHTML = cart.map(i => `
          <div class="pt-3 flex justify-between items-center text-stone-200">
            <div>
              <h4 class="font-semibold text-sm">${i.id}: ${i.name}</h4>
              <p class="text-xs text-stone-400">$${i.price.toFixed(2)} each</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="updateCartQty('${i.id}', -1)" class="w-6 h-6 bg-stone-800 text-stone-300 rounded flex items-center justify-center font-bold text-xs hover:bg-stone-700">-</button>
              <span class="text-xs font-bold px-1">${i.qty}</span>
              <button onclick="updateCartQty('${i.id}', 1)" class="w-6 h-6 bg-stone-800 text-stone-300 rounded flex items-center justify-center font-bold text-xs hover:bg-stone-700">+</button>
              <span class="text-sm font-bold text-rose-400 w-12 text-right">$${(i.price * i.qty).toFixed(2)}</span>
            </div>
          </div>
        `).join('');
      }
    }

    function toggleCartModal() { document.getElementById('cartModal').classList.toggle('hidden'); }
  </script>
</body>
</html>
